<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0809" />
    <title>You’re offline · afjini</title>
    <style>
      :root { color-scheme: dark light; }
      body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; background: #0b0809; color: #f5efef; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      @media (prefers-color-scheme: light) { body { background: #f6f4f4; color: #1a1416; } p { color: #6e6669; } }
      .mark { display: block; width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 18px; background: #000; object-fit: cover; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { max-width: 340px; margin: 0 auto 20px; color: #a69a9b; }
      button { padding: 10px 18px; border: 0; border-radius: 12px; background: #a3161c; color: #ffffff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/192.png" alt="" width="72" height="72" />
      <h1>You’re offline</h1>
      <p>afjini needs a connection to load your chats. Messages you already sent are safe and will sync when you’re back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', () => location.reload())</script>
  </body>
</html>
