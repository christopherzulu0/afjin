<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#061f28" />
    <title>You’re offline · afjini</title>
    <style>
      :root { color-scheme: dark light; }
      body { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; background: #061f28; color: #f6ecd9; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      @media (prefers-color-scheme: light) { body { background: #f7f1e6; color: #1f2a2e; } p { color: #5c6769; } }
      .mark { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; background: linear-gradient(180deg, #f0c467, #c89536); color: #061f28; font-size: 26px; font-weight: 700; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { max-width: 340px; margin: 0 auto 20px; color: #b7aea0; }
      button { padding: 10px 18px; border: 0; border-radius: 12px; background: #e2b85c; color: #061f28; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A</div>
      <h1>You’re offline</h1>
      <p>afjini needs a connection to load your chats. Messages you already sent are safe and will sync when you’re back.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', () => location.reload())</script>
  </body>
</html>
